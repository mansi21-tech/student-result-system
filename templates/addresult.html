<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student Result</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Add Student Result</h1>

    <form
        action="/add"
        method="POST"
        onsubmit="return validateForm()"
    >

        <!-- ROLL NUMBER -->

        <label>
            Roll Number
        </label>

        <input
            type="text"
            id="roll_no"
            name="roll_no"
            placeholder="Enter roll number"
            required
        >


        <!-- NAME -->

        <label>
            Student Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter student name"
            required
        >


        <!-- MATHS -->

        <label>
            Mathematics Marks
        </label>

        <input
            type="number"
            id="maths"
            name="maths"
            min="0"
            max="100"
            placeholder="0 - 100"
            required
            oninput="calculatePreview()"
        >


        <!-- SCIENCE -->

        <label>
            Science Marks
        </label>

        <input
            type="number"
            id="science"
            name="science"
            min="0"
            max="100"
            placeholder="0 - 100"
            required
            oninput="calculatePreview()"
        >


        <!-- ENGLISH -->

        <label>
            English Marks
        </label>

        <input
            type="number"
            id="english"
            name="english"
            min="0"
            max="100"
            placeholder="0 - 100"
            required
            oninput="calculatePreview()"
        >


        <!-- COMPUTER -->

        <label>
            Computer Marks
        </label>

        <input
            type="number"
            id="computer"
            name="computer"
            min="0"
            max="100"
            placeholder="0 - 100"
            required
            oninput="calculatePreview()"
        >


        <!-- LIVE PREVIEW -->

        <div id="preview">
            Total: 0 | Percentage: 0.00%
        </div>


        <button type="submit">
            Save Result
        </button>

    </form>


    <a href="/" class="back-link">
        ← Back to Home
    </a>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
